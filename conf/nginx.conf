location @__APP__--proxy  {

  proxy_pass      http://127.0.0.1:__PORT__;
  include         proxy_params_no_auth;
  proxy_redirect  off;
}

location = /admin/favicon.ico {
  alias __INSTALL_DIR__/build/client/favicon.ico;
}

# Support relative URLs
location = __PATH__ { return 302 /admin/; }

location /admin/ {
  try_files $uri $uri/ @__APP__--proxy;
}
